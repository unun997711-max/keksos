
name: Open World Android Game Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"
  PROJECT_NAME: "OpenWorld"
  APK_NAME: "OpenWorld-Android.apk"

jobs:
  build:
    name: Build 3D Open World Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip openjdk-17-jdk

      - name: Download Godot Engine
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Create Game Project
        run: |
          mkdir -p game/scenes
          mkdir -p game/scripts
          mkdir -p game/assets
          mkdir -p build

      - name: Configure Project
        run: |
          cat > game/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Open World"
          config/description="3D Open World Android Action Game"
          run/main_scene="res://scenes/main.tscn"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          environment/defaults/default_clear_color=Color(0.35,0.48,0.57,1)

          [physics]
          3d/default_gravity=9.8

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=1
          EOF

      - name: Initialize Game Engine
        run: |
          cd game
          godot --headless --editor --path . --quit

      - name: Create 3D Game Scene
        run: |
          cat > game/scenes/main.tscn <<'EOF'
          [gd_scene load_steps=3 format=3]

          [ext_resource type="Script" path="res://scripts/main.gd" id="1"]

          [sub_resource type="Environment" id="Environment_world"]
          background_mode = 1
          background_color = Color(0.48,0.65,0.76,1)
          ambient_light_source = 3
          ambient_light_color = Color(0.75,0.82,0.91,1)
          ambient_light_energy = 0.8
          tonemap_mode = 2
          glow_enabled = true
          glow_intensity = 0.3

          [node name="Main" type="Node3D"]
          script = ExtResource("1")

          [node name="WorldEnvironment" type="WorldEnvironment" parent="."]
          environment = SubResource("Environment_world")

          [node name="Sun" type="DirectionalLight3D" parent="."]
          rotation_degrees = Vector3(-48,-32,0)
          light_color = Color(1,0.91,0.78,1)
          light_energy = 1.3
          shadow_enabled = true
          directional_shadow_max_distance = 120.0
          EOF

      - name: Create Game Engine Script
        run: |
          cat > game/scripts/main.gd <<'EOF'
          extends Node3D

          const WORLD_SIZE = 500.0
          const ROAD_WIDTH = 20.0

          var player: CharacterBody3D
          var camera: Camera3D
          var world_material: StandardMaterial3D

          func _ready():
              create_world()
              create_player()
              create_camera()
              print("OPEN WORLD INITIALIZED")

          func create_material(color: Color, roughness: float = 0.8):
              var material = StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              return material

          func create_box(size: Vector3, material: Material, position: Vector3):
              var mesh = BoxMesh.new()
              mesh.size = size

              var instance = MeshInstance3D.new()
              instance.mesh = mesh
              instance.material_override = material
              instance.position = position
              instance.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_ON
              add_child(instance)
              return instance

          func create_world():
              world_material = create_material(Color(0.19,0.29,0.23))
              create_box(
                  Vector3(WORLD_SIZE,1,WORLD_SIZE),
                  world_material,
                  Vector3(0,-0.6,0)
              )

              var road_material = create_material(Color(0.12,0.13,0.14))
              var line_material = create_material(Color(0.92,0.83,0.55))

              for i in range(-200,201,80):
                  create_box(
                      Vector3(WORLD_SIZE,0.12,ROAD_WIDTH),
                      road_material,
                      Vector3(0,0,i)
                  )

                  create_box(
                      Vector3(ROAD_WIDTH,0.12,WORLD_SIZE),
                      road_material,
                      Vector3(i,0,0)
                  )

              print("WORLD TERRAIN CREATED")

          EOF

      - name: Create Detailed City Buildings
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          func create_building(position: Vector3, width: float, depth: float, height: float, color: Color):
              var building = Node3D.new()
              building.position = position
              add_child(building)

              var wall_material = create_material(color, 0.75)
              var glass_material = StandardMaterial3D.new()
              glass_material.albedo_color = Color(0.12,0.25,0.32)
              glass_material.metallic = 0.45
              glass_material.roughness = 0.2

              var body_mesh = BoxMesh.new()
              body_mesh.size = Vector3(width,height,depth)

              var body = MeshInstance3D.new()
              body.mesh = body_mesh
              body.position.y = height * 0.5
              body.material_override = wall_material
              body.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_ON
              building.add_child(body)

              var window_mesh = BoxMesh.new()
              window_mesh.size = Vector3(1.35,1.5,0.12)

              var floors = int(height / 3.5)
              var columns = int(width / 3.5)

              for floor in range(1,floors):
                  for column in range(columns):
                      var window = MeshInstance3D.new()
                      window.mesh = window_mesh
                      window.material_override = glass_material

                      var wx = -width * 0.5 + 2.0 + column * 3.3
                      var wy = floor * 3.5

                      window.position = Vector3(wx,wy,depth * 0.5 + 0.08)
                      building.add_child(window)

                      var opposite = window.duplicate()
                      opposite.position.z = -depth * 0.5 - 0.08
                      building.add_child(opposite)

              var roof = MeshInstance3D.new()
              var roof_mesh = BoxMesh.new()
              roof_mesh.size = Vector3(width + 0.5,0.4,depth + 0.5)
              roof.mesh = roof_mesh
              roof.material_override = create_material(Color(0.16,0.18,0.19))
              roof.position.y = height + 0.2
              building.add_child(roof)

              return building

          func create_city():
              var colors = [
                  Color(0.64,0.65,0.62),
                  Color(0.48,0.54,0.57),
                  Color(0.72,0.66,0.56),
                  Color(0.39,0.46,0.49),
                  Color(0.76,0.73,0.66)
              ]

              var rng = RandomNumberGenerator.new()
              rng.randomize()

              for x in range(-220,221,40):
                  for z in range(-220,221,40):

                      if abs(x % 80) < 24 or abs(z % 80) < 24:
                          continue

                      var width = rng.randf_range(18,29)
                      var depth = rng.randf_range(18,29)
                      var height = rng.randf_range(15,65)
                      var color = colors[rng.randi_range(0,colors.size()-1)]

                      create_building(
                          Vector3(
                              x + rng.randf_range(-4,4),
                              0,
                              z + rng.randf_range(-4,4)
                          ),
                          width,
                          depth,
                          height,
                          color
                      )

              print("CITY BUILDINGS CREATED")

          EOF

      - name: Activate City Generation
        run: |
          python3 - <<'PY'
          path = "game/scripts/main.gd"
          with open(path, "r") as f:
              code = f.read()
          code = code.replace(
              "create_world()\n              create_player()",
              "create_world()\n              create_city()\n              create_player()"
          )
          with open(path, "w") as f:
              f.write(code)
          PY

      - name: Create Player Character
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          var player_material: StandardMaterial3D
          var skin_material: StandardMaterial3D
          var clothes_material: StandardMaterial3D

          func create_player():
              player = CharacterBody3D.new()
              player.name = "Player"
              player.position = Vector3(0,1,0)
              player.collision_layer = 1
              player.collision_mask = 1
              add_child(player)

              var capsule = CapsuleShape3D.new()
              capsule.radius = 0.42
              capsule.height = 1.85

              var collision = CollisionShape3D.new()
              collision.shape = capsule
              collision.position.y = 0.95
              player.add_child(collision)

              player_material = create_material(Color(0.12,0.16,0.19))
              skin_material = create_material(Color(0.72,0.49,0.34))
              clothes_material = create_material(Color(0.18,0.25,0.32))

              var visual = Node3D.new()
              visual.name = "CharacterVisual"
              player.add_child(visual)

              create_character_part(
                  visual,
                  Vector3(0,1.35,0),
                  Vector3(0.58,0.72,0.32),
                  clothes_material
              )

              create_character_part(
                  visual,
                  Vector3(0,1.94,0),
                  Vector3(0.38,0.42,0.38),
                  skin_material
              )

              create_character_part(
                  visual,
                  Vector3(0,2.17,-0.015),
                  Vector3(0.43,0.13,0.4),
                  player_material
              )

              for side in [-1,1]:
                  create_character_part(
                      visual,
                      Vector3(side * 0.39,1.38,0),
                      Vector3(0.2,0.7,0.22),
                      clothes_material
                  )

                  create_character_part(
                      visual,
                      Vector3(side * 0.39,1.0,0),
                      Vector3(0.18,0.22,0.2),
                      skin_material
                  )

                  create_character_part(
                      visual,
                      Vector3(side * 0.16,0.58,0),
                      Vector3(0.23,0.78,0.25),
                      player_material
                  )

                  create_character_part(
                      visual,
                      Vector3(side * 0.16,0.14,-0.07),
                      Vector3(0.25,0.22,0.42),
                      player_material
                  )

              create_character_part(
                  visual,
                  Vector3(0,0.95,0.2),
                  Vector3(0.5,0.13,0.12),
                  skin_material
              )

              print("PLAYER CHARACTER CREATED")

          func create_character_part(parent: Node3D, pos: Vector3, dimensions: Vector3, material: Material):
              var mesh = CapsuleMesh.new()
              mesh.radius = min(dimensions.x,dimensions.z) * 0.5
              mesh.height = max(dimensions.y,mesh.radius * 2.0)

              var part = MeshInstance3D.new()
              part.mesh = mesh
              part.material_override = material
              part.position = pos
              part.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_ON
              parent.add_child(part)
              return part

          var player_speed = 6.0
          var sprint_speed = 10.0
          var gravity = 9.8

          func _physics_process(delta):
              if player == null:
                  return

              var direction = Vector3.ZERO

              if Input.is_key_pressed(KEY_W):
                  direction.z -= 1
              if Input.is_key_pressed(KEY_S):
                  direction.z += 1
              if Input.is_key_pressed(KEY_A):
                  direction.x -= 1
              if Input.is_key_pressed(KEY_D):
                  direction.x += 1

              direction = direction.normalized()

              var speed = sprint_speed if Input.is_key_pressed(KEY_SHIFT) else player_speed

              if direction.length() > 0:
                  player.velocity.x = direction.x * speed
                  player.velocity.z = direction.z * speed

                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      atan2(direction.x,direction.z),
                      delta * 9.0
                  )
              else:
                  player.velocity.x = move_toward(player.velocity.x,0,20*delta)
                  player.velocity.z = move_toward(player.velocity.z,0,20*delta)

              if not player.is_on_floor():
                  player.velocity.y -= gravity * delta
              else:
                  if Input.is_key_pressed(KEY_SPACE):
                      player.velocity.y = 5.5

              player.move_and_slide()

          EOF

      - name: Create Third Person Camera
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          func create_camera():
              camera = Camera3D.new()
              camera.name = "ThirdPersonCamera"
              camera.fov = 72
              camera.near = 0.1
              camera.far = 900
              camera.current = true
              add_child(camera)

              camera.position = Vector3(0,5,10)
              camera.look_at(Vector3.ZERO,Vector3.UP)

              print("THIRD PERSON CAMERA CREATED")

          func update_camera(delta):
              if player == null or camera == null:
                  return

              var target = player.global_position + Vector3(0,2.2,0)
              var behind = player.global_transform.basis.z.normalized()
              var desired = target + behind * 7.0 + Vector3(0,2.2,0)

              camera.global_position = camera.global_position.lerp(
                  desired,
                  1.0 - exp(-5.0 * delta)
              )

              camera.look_at(target,Vector3.UP)

          func _process(delta):
              update_camera(delta)

          EOF

      - name: Create Detailed Sports Vehicle System
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          var vehicle: CharacterBody3D
          var vehicle_model: Node3D
          var vehicle_active = false
          var vehicle_speed = 0.0
          var vehicle_max_speed = 38.0
          var vehicle_acceleration = 19.0
          var vehicle_steering = 0.0
          var vehicle_wheels = []

          func create_vehicle():
              vehicle = CharacterBody3D.new()
              vehicle.name = "SportsCar"
              vehicle.position = Vector3(5,0.65,5)
              vehicle.collision_layer = 1
              vehicle.collision_mask = 1
              add_child(vehicle)

              var shape = BoxShape3D.new()
              shape.size = Vector3(2.1,1.25,4.4)

              var collision = CollisionShape3D.new()
              collision.shape = shape
              collision.position.y = 0.15
              vehicle.add_child(collision)

              vehicle_model = Node3D.new()
              vehicle.add_child(vehicle_model)

              var paint = StandardMaterial3D.new()
              paint.albedo_color = Color(0.65,0.045,0.025)
              paint.metallic = 0.78
              paint.roughness = 0.24

              var glass = StandardMaterial3D.new()
              glass.albedo_color = Color(0.035,0.12,0.17)
              glass.metallic = 0.55
              glass.roughness = 0.15

              var rubber = create_material(Color(0.025,0.027,0.03),0.95)
              var chrome = create_material(Color(0.65,0.68,0.7),0.2)

              create_car_shape(
                  Vector3(0,0,0),
                  Vector3(2.0,0.65,4.2),
                  paint
              )

              create_car_shape(
                  Vector3(0,0.55,-0.15),
                  Vector3(1.65,0.85,2.15),
                  paint
              )

              create_car_shape(
                  Vector3(0,0.85,-0.15),
                  Vector3(1.5,0.55,1.85),
                  glass
              )

              for side in [-1,1]:
                  for front in [-1,1]:
                      var wheel = MeshInstance3D.new()
                      var wheel_mesh = CylinderMesh.new()
                      wheel_mesh.top_radius = 0.42
                      wheel_mesh.bottom_radius = 0.42
                      wheel_mesh.height = 0.28
                      wheel.mesh = wheel_mesh
                      wheel.material_override = rubber
                      wheel.rotation.z = PI / 2
                      wheel.position = Vector3(
                          side * 1.02,
                          -0.17,
                          front * 1.35
                      )
                      vehicle_model.add_child(wheel)
                      vehicle_wheels.append(wheel)

                      var rim = MeshInstance3D.new()
                      var rim_mesh = CylinderMesh.new()
                      rim_mesh.top_radius = 0.22
                      rim_mesh.bottom_radius = 0.22
                      rim_mesh.height = 0.3
                      rim.mesh = rim_mesh
                      rim.material_override = chrome
                      rim.rotation.z = PI / 2
                      rim.position = wheel.position
                      vehicle_model.add_child(rim)

              var headlight_material = StandardMaterial3D.new()
              headlight_material.albedo_color = Color(1,0.95,0.72)
              headlight_material.emission_enabled = true
              headlight_material.emission = Color(1,0.8,0.45)
              headlight_material.emission_energy_multiplier = 1.5

              for side in [-1,1]:
                  create_car_shape(
                      Vector3(side*0.68,0.13,2.12),
                      Vector3(0.48,0.2,0.08),
                      headlight_material
                  )

              var tail_material = StandardMaterial3D.new()
              tail_material.albedo_color = Color(0.8,0.015,0.01)
              tail_material.emission_enabled = true
              tail_material.emission = Color(0.8,0.01,0.005)

              for side in [-1,1]:
                  create_car_shape(
                      Vector3(side*0.68,0.13,-2.12),
                      Vector3(0.48,0.2,0.08),
                      tail_material
                  )

              print("SPORTS VEHICLE CREATED")

          func create_car_shape(pos: Vector3, size: Vector3, material: Material):
              var mesh = BoxMesh.new()
              mesh.size = size

              var instance = MeshInstance3D.new()
              instance.mesh = mesh
              instance.material_override = material
              instance.position = pos
              vehicle_model.add_child(instance)
              return instance

          func enter_exit_vehicle():
              if vehicle == null:
                  return

              if vehicle_active:
                  vehicle_active = false
                  player.visible = true
                  player.position = vehicle.position + Vector3(2,0,0)
                  player.velocity = Vector3.ZERO
              else:
                  if player.global_position.distance_to(vehicle.global_position) < 4.0:
                      vehicle_active = true
                      player.visible = false
                      player.velocity = Vector3.ZERO

          func update_vehicle_input(delta):
              if not vehicle_active:
                  return

              var acceleration_input = 0.0
              var steering_input = 0.0

              if Input.is_key_pressed(KEY_W):
                  acceleration_input += 1.0
              if Input.is_key_pressed(KEY_S):
                  acceleration_input -= 1.0
              if Input.is_key_pressed(KEY_A):
                  steering_input += 1.0
              if Input.is_key_pressed(KEY_D):
                  steering_input -= 1.0

              vehicle_speed = move_toward(
                  vehicle_speed,
                  acceleration_input * vehicle_max_speed,
                  vehicle_acceleration * delta
              )

              vehicle_steering = move_toward(
                  vehicle_steering,
                  steering_input,
                  delta * 3.0
              )

              vehicle.rotation.y += (
                  vehicle_steering *
                  vehicle_speed / vehicle_max_speed *
                  1.7 * delta
              )

              var forward = -vehicle.global_transform.basis.z

              vehicle.velocity.x = forward.x * vehicle_speed
              vehicle.velocity.z = forward.z * vehicle_speed
              vehicle.velocity.y -= 9.8 * delta

              vehicle.move_and_slide()

              for wheel in vehicle_wheels:
                  wheel.rotate_object_local(Vector3.RIGHT,vehicle_speed*delta*2.0)

          EOF

      - name: Connect Vehicle To Game
        run: |
          python3 - <<'PY'
          p="game/scripts/main.gd"
          s=open(p).read()
          s=s.replace(
              "create_camera()\n              print",
              "create_camera()\n              create_vehicle()\n              print"
          )
          s=s.replace(
              "if player == null:\n                  return\n\n              var direction",
              "if player == null:\n                  return\n\n              if vehicle_active:\n                  update_vehicle_input(delta)\n                  return\n\n              var direction"
          )
          s=s.replace(
              "func _process(delta):\n              update_camera(delta)",
              "func _process(delta):\n              update_camera(delta)\n              if Input.is_action_just_pressed(\"interact\"):\n                  enter_exit_vehicle()"
          )
          s += """
          func _unhandled_key_input(event):
              if event is InputEventKey and event.pressed and not event.echo:
                  if event.keycode == KEY_E:
                      enter_exit_vehicle()
          """
          open(p,"w").write(s)
          PY

      - name: Add Mobile Controls And Physics
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          var mobile_ui: CanvasLayer
          var mobile_buttons = {}
          var mobile_input = {
              "forward": false,
              "backward": false,
              "left": false,
              "right": false,
              "sprint": false
          }

          var mobile_jump = false
          var mobile_interact = false

          func create_mobile_controls():
              mobile_ui = CanvasLayer.new()
              mobile_ui.name = "MobileControls"
              add_child(mobile_ui)

              var panel = Control.new()
              panel.set_anchors_preset(Control.PRESET_FULL_RECT)
              panel.mouse_filter = Control.MOUSE_FILTER_PASS
              mobile_ui.add_child(panel)

              var controls = [
                  ["forward","▲",Vector2(115, -190),Vector2(65,65)],
                  ["backward","▼",Vector2(115,-55),Vector2(65,65)],
                  ["left","◀",Vector2(45,-122),Vector2(65,65)],
                  ["right","▶",Vector2(185,-122),Vector2(65,65)],
                  ["sprint","RUN",Vector2(-110,-195),Vector2(85,65)]
              ]

              for item in controls:
                  var button = Button.new()
                  button.text = item[1]
                  button.custom_minimum_size = item[3]
                  button.position = Vector2(0,0)
                  button.set_anchors_preset(Control.PRESET_BOTTOM_LEFT)
                  button.position = item[2]
                  button.add_theme_font_size_override("font_size",20)
                  button.add_theme_color_override("font_color",Color.WHITE)
                  button.add_theme_color_override("font_hover_color",Color.WHITE)
                  button.add_theme_stylebox_override(
                      "normal",
                      make_button_style(Color(0.08,0.13,0.17,0.75))
                  )
                  button.add_theme_stylebox_override(
                      "pressed",
                      make_button_style(Color(0.25,0.5,0.55,0.9))
                  )

                  button.button_down.connect(
                      func(): mobile_input[item[0]] = true
                  )
                  button.button_up.connect(
                      func(): mobile_input[item[0]] = false
                  )

                  panel.add_child(button)
                  mobile_buttons[item[0]] = button

              add_action_button(panel,"JUMP",Vector2(-105,-110),"jump")
              add_action_button(panel,"ACTION",Vector2(-105,-35),"interact")

          func make_button_style(color: Color):
              var style = StyleBoxFlat.new()
              style.bg_color = color
              style.corner_radius_top_left = 18
              style.corner_radius_top_right = 18
              style.corner_radius_bottom_left = 18
              style.corner_radius_bottom_right = 18
              style.border_width_left = 1
              style.border_width_right = 1
              style.border_width_top = 1
              style.border_width_bottom = 1
              style.border_color = Color(0.8,0.85,0.9,0.5)
              return style

          func add_action_button(parent: Control, title: String, pos: Vector2, action: String):
              var button = Button.new()
              button.text = title
              button.custom_minimum_size = Vector2(95,60)
              button.set_anchors_preset(Control.PRESET_BOTTOM_RIGHT)
              button.position = pos
              button.add_theme_font_size_override("font_size",15)
              button.add_theme_color_override("font_color",Color.WHITE)
              button.add_theme_stylebox_override(
                  "normal",
                  make_button_style(Color(0.1,0.2,0.25,0.8))
              )

              if action == "jump":
                  button.button_down.connect(func(): mobile_jump = true)
                  button.button_up.connect(func(): mobile_jump = false)
              else:
                  button.pressed.connect(func(): mobile_interact = true)

              parent.add_child(button)

          func update_mobile_input():
              var direction = Vector3.ZERO

              if mobile_input.forward:
                  direction.z -= 1
              if mobile_input.backward:
                  direction.z += 1
              if mobile_input.left:
                  direction.x -= 1
              if mobile_input.right:
                  direction.x += 1

              return direction.normalized()

          func add_ground_collision():
              var body = StaticBody3D.new()
              body.name = "GroundCollision"

              var shape = BoxShape3D.new()
              shape.size = Vector3(WORLD_SIZE,1,WORLD_SIZE)

              var collision = CollisionShape3D.new()
