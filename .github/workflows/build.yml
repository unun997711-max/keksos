      - name: Create Weapon And Combat System
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          var weapon_root: Node3D
          var weapon_ready = true
          var weapon_damage = 35.0
          var weapon_range = 100.0
          var ammo = 30
          var reserve_ammo = 120
          var shooting = false
          var reloading = false
          var shoot_cooldown = 0.0

          func create_weapon_system():
              weapon_root = Node3D.new()
              weapon_root.name = "AssaultRifle"
              weapon_root.position = Vector3(0.35,1.35,-0.55)
              player.get_node("CharacterVisual").add_child(weapon_root)

              var metal = StandardMaterial3D.new()
              metal.albedo_color = Color(0.12,0.14,0.16)
              metal.metallic = 0.85
              metal.roughness = 0.3

              var polymer = create_material(Color(0.16,0.12,0.09),0.7)
              var barrel_material = create_material(Color(0.055,0.06,0.065),0.3)

              weapon_part(weapon_root,Vector3(0,0,0),Vector3(0.11,0.13,0.55),metal)
              weapon_part(weapon_root,Vector3(0,0.02,-0.42),Vector3(0.065,0.065,0.48),barrel_material)
              weapon_part(weapon_root,Vector3(0,-0.12,-0.03),Vector3(0.13,0.25,0.17),polymer)
              weapon_part(weapon_root,Vector3(0,-0.22,0.18),Vector3(0.12,0.34,0.13),polymer)
              weapon_part(weapon_root,Vector3(0,0.12,0.08),Vector3(0.07,0.12,0.24),metal)
              weapon_part(weapon_root,Vector3(0,0.15,-0.42),Vector3(0.045,0.045,0.14),metal)

              var muzzle = weapon_part(
                  weapon_root,
                  Vector3(0,0,-0.68),
                  Vector3(0.09,0.09,0.12),
                  metal
              )
              weapon_root.visible = true

              print("WEAPON SYSTEM READY")

          func weapon_part(parent: Node3D,pos: Vector3,size: Vector3,material: Material):
              var mesh = BoxMesh.new()
              mesh.size = size

              var part = MeshInstance3D.new()
              part.mesh = mesh
              part.material_override = material
              part.position = pos
              parent.add_child(part)
              return part

          func fire_weapon():
              if not weapon_ready or reloading or ammo <= 0:
                  return

              weapon_ready = false
              ammo -= 1
              shoot_cooldown = 0.16

              if weapon_root:
                  weapon_root.position.z = -0.35

              var origin = camera.global_position
              var direction = -camera.global_transform.basis.z

              var query = PhysicsRayQueryParameters3D.create(
                  origin,
                  origin + direction * weapon_range
              )

              query.exclude = [player.get_rid()]
              var result = get_world_3d().direct_space_state.intersect_ray(query)

              if not result.is_empty():
                  var hit = result.collider

                  if hit.has_method("take_damage"):
                      hit.take_damage(weapon_damage)

              print("SHOT FIRED | AMMO: ",ammo)

          func reload_weapon():
              if reloading or ammo >= 30 or reserve_ammo <= 0:
                  return

              reloading = true
              await get_tree().create_timer(1.8).timeout

              var needed = 30 - ammo
              var amount = min(needed,reserve_ammo)

              ammo += amount
              reserve_ammo -= amount
              reloading = false

              print("WEAPON RELOADED")

          func update_weapon(delta):
              shoot_cooldown = max(0.0,shoot_cooldown-delta)

              if shoot_cooldown <= 0.0:
                  weapon_ready = true

              if weapon_root:
                  weapon_root.position.z = lerp(
                      weapon_root.position.z,
                      -0.55,
                      delta * 12.0
                  )

          func weapon_input():
              if Input.is_mouse_button_pressed(MOUSE_BUTTON_LEFT):
                  if shoot_cooldown <= 0.0:
                      fire_weapon()

              if Input.is_key_pressed(KEY_R):
                  if not reloading:
                      reload_weapon()

          func _input(event):
              if event is InputEventScreenTouch and event.pressed:
                  if event.position.x > get_viewport().size.x * 0.55:
                      if event.position.y < get_viewport().size.y * 0.65:
                          fire_weapon()

              if event is InputEventKey and event.pressed and not event.echo:
                  if event.keycode == KEY_R:
                      reload_weapon()

          EOF

