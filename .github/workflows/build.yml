                      if abs(x) % 2 == 0 and abs(z) % 2 == 0:
                          var pole = MeshInstance3D.new()
                          var pole_mesh = CylinderMesh.new()
                          pole_mesh.top_radius = 0.09
                          pole_mesh.bottom_radius = 0.14
                          pole_mesh.height = 7.0
                          pole.mesh = pole_mesh
                          pole.position = Vector3(x*24,3.5,z*24+7)
                          pole.material_override = make_material(
                              Color(0.12,0.17,0.22),0.7
                          )
                          add_child(pole)

                          var lamp = MeshInstance3D.new()
                          var lamp_mesh = SphereMesh.new()
                          lamp_mesh.radius = 0.45
                          lamp_mesh.height = 0.9
                          lamp.mesh = lamp_mesh
                          lamp.position = Vector3(x*24,7,z*24+7)
                          lamp.material_override = make_material(
                              Color(0.8,0.95,1.0),0.1,1.0
                          )
                          add_child(lamp)

                          var light = OmniLight3D.new()
                          light.position = Vector3(x*24,6.5,z*24+7)
                          light.light_color = Color(0.55,0.75,1.0)
                          light.light_energy = 1.2
                          light.omni_range = 13
                          add_child(light)

          func create_city_trees():
              for x in range(-5,6):
                  for z in range(-5,6):
                      if abs(x) < 2 or abs(z) < 2:
                          continue

                      if (x*7+z*3) % 3 == 0:
                          var tree = Node3D.new()
                          tree.position = Vector3(x*19,0,z*19)
                          add_child(tree)

                          var trunk = MeshInstance3D.new()
                          var trunk_mesh = CylinderMesh.new()
                          trunk_mesh.top_radius = 0.25
                          trunk_mesh.bottom_radius = 0.38
                          trunk_mesh.height = 3.0
                          trunk.mesh = trunk_mesh
                          trunk.position.y = 1.5
                          trunk.material_override = make_material(
                              Color(0.22,0.12,0.07)
                          )
                          tree.add_child(trunk)

                          var leaves = MeshInstance3D.new()
                          var leaves_mesh = SphereMesh.new()
                          leaves_mesh.radius = 2.0
                          leaves_mesh.height = 3.8
                          leaves.mesh = leaves_mesh
                          leaves.position.y = 4.0
                          leaves.material_override = make_material(
                              Color(0.035,0.25,0.12),0.85
                          )
                          tree.add_child(leaves)

          func create_neon_signs():
              var sign_colors = [
                  Color(0.0,0.8,1.0),
                  Color(1.0,0.1,0.45),
                  Color(0.6,0.2,1.0),
                  Color(1.0,0.65,0.05)
              ]

              for i in range(12):
                  var sign = MeshInstance3D.new()
                  var sign_mesh = BoxMesh.new()
                  sign_mesh.size = Vector3(4.5,1.0,0.18)
                  sign.mesh = sign_mesh

                  var x = float((i%4)-2)*27.0
                  var z = float(int(i/4)-1)*35.0
                  sign.position = Vector3(x,9,z)

                  sign.material_override = make_material(
                      sign_colors[i%sign_colors.size()],0.15,1.8
                  )
                  add_child(sign)

          func create_mission_beacon():
              mission_beacon = MeshInstance3D.new()
              var beacon_mesh = CylinderMesh.new()
              beacon_mesh.top_radius = 0.15
              beacon_mesh.bottom_radius = 2.2
              beacon_mesh.height = 0.12
              mission_beacon.mesh = beacon_mesh
              mission_beacon.material_override = make_material(
                  Color(0.0,0.85,1.0),0.15,2.0
              )
              add_child(mission_beacon)

          func update_mission_beacon(delta):
              beacon_time += delta

              if mission_beacon == null or player == null:
                  return

              mission_beacon.global_position = Vector3(
                  mission_target.x,
                  0.12 + sin(beacon_time*2.5)*0.08,
                  mission_target.z
              )

              mission_beacon.rotation.y += delta*0.8

          func create_extra_environment():
              var world_environment = WorldEnvironment.new()
              var environment = Environment.new()
              environment.background_mode = Environment.BG_SKY

              var sky = Sky.new()
              var sky_material = ProceduralSkyMaterial.new()
              sky_material.sky_top_color = Color(0.025,0.055,0.13)
              sky_material.sky_horizon_color = Color(0.18,0.25,0.38)
              sky_material.ground_bottom_color = Color(0.025,0.035,0.05)
              sky_material.ground_horizon_color = Color(0.12,0.15,0.2)
              sky.sky_material = sky_material

              environment.sky = sky
              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color(0.35,0.42,0.58)
              environment.ambient_light_energy = 0.7
              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC

              world_environment.environment = environment
              add_child(world_environment)

          func make_material(color: Color, roughness_value=0.8, emission_value=0.0):
              var material = StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness_value

              if emission_value > 0.0:
                  material.emission_enabled = true
                  material.emission = color
                  material.emission_energy_multiplier = emission_value

              return material

          EOF

      - name: Integrate City Details And Fix Script
        run: |
          python3 - <<'PY'
          p = "game/scripts/main.gd"
          s = open(p).read()

          s = s.replace(
              "create_game_hud()\n              create_navigation_system()",
              "create_game_hud()\n              create_city_details()\n              create_navigation_system()"
          )

          s = s.replace(
              "update_navigation(delta)\n              update_hud()",
              "update_navigation(delta)\n              update_mission_beacon(delta)\n              update_hud()"
          )

          s = s.replace(
              '              officer.set_script(load("res://scripts/police.gd")) if false else null\n',
              ''
          )

          open(p,"w").write(s)
          PY

      - name: Configure Android Export
        run: |
          mkdir -p game
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/CityAction.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.cityaction.game"
          package/name="City Action"
          package/signed=true
          package/app_category=2
          package/allow_backup=false
          version/code=1
          version/name="1.0"

          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          permissions/internet=true
          permissions/access_network_state=true
          EOF

      - name: Setup Java And Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot Android Templates
        run: |
          godot --headless --editor --path game --install-android-build-template --quit

      - name: Validate Game Project
        run: |
          godot --headless --editor --path game --import --quit
          godot --headless --path game --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Android" build/CityAction.apk
          test -s build/CityAction.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CityAction-Android-APK
          path: build/CityAction.apk
          if-no-files-found: error
          retention-days: 30
