      - name: Create Police And Wanted System
        run: |
          cat >> game/scripts/main.gd <<'EOF'

          var wanted_level = 0
          var police_units = []
          var police_spawn_timer = 0.0
          var police_spawn_interval = 12.0
          var wanted_decay_timer = 0.0

          func increase_wanted(amount: int = 1):
              wanted_level = clampi(wanted_level + amount,0,5)
              wanted_decay_timer = 0.0
              print("WANTED LEVEL: ",wanted_level)

          func reduce_wanted():
              wanted_level = max(0,wanted_level-1)
              print("WANTED LEVEL REDUCED: ",wanted_level)

          func create_police_officer(position: Vector3):
              var officer = CharacterBody3D.new()
              officer.name = "PoliceOfficer"
              officer.position = position
              officer.collision_layer = 1
              officer.collision_mask = 1
              add_child(officer)

              var capsule = CapsuleShape3D.new()
              capsule.radius = 0.4
              capsule.height = 1.8

              var collision = CollisionShape3D.new()
              collision.shape = capsule
              collision.position.y = 0.9
              officer.add_child(collision)

              var uniform = create_material(Color(0.035,0.075,0.19))
              var skin = create_material(Color(0.65,0.43,0.31))
              var badge = create_material(Color(0.85,0.67,0.2),0.3)

              create_character_part(
                  officer,
                  Vector3(0,1.3,0),
                  Vector3(0.6,0.7,0.35),
                  uniform
              )

              create_character_part(
                  officer,
                  Vector3(0,1.9,0),
                  Vector3(0.38,0.4,0.38),
                  skin
              )

              create_character_part(
                  officer,
                  Vector3(0,2.13,0),
                  Vector3(0.42,0.13,0.4),
                  uniform
              )

              create_character_part(
                  officer,
                  Vector3(0.31,1.48,0.19),
                  Vector3(0.12,0.16,0.05),
                  badge
              )

              for side in [-1,1]:
                  create_character_part(
                      officer,
                      Vector3(side*0.38,1.35,0),
                      Vector3(0.2,0.65,0.22),
                      uniform
                  )

                  create_character_part(
                      officer,
                      Vector3(side*0.15,0.55,0),
                      Vector3(0.22,0.8,0.25),
                      uniform
                  )

              officer.set_meta("health",100.0)
              officer.set_meta("attack_timer",0.0)

              officer.set_script(load("res://scripts/police.gd")) if false else null

              police_units.append(officer)
              return officer

          func spawn_police():
              if wanted_level <= 0:
                  return

              var count = mini(wanted_level,5)

              for i in range(count):
                  if police_units.size() >= 10:
                      break

                  var angle = randf() * TAU
                  var distance = randf_range(25,40)

                  var spawn_position = player.global_position + Vector3(
                      cos(angle)*distance,
                      1,
                      sin(angle)*distance
                  )

                  create_police_officer(spawn_position)

              print("POLICE UNITS DEPLOYED")

          func update_police(delta):
              if player == null:
                  return

              police_spawn_timer += delta
              wanted_decay_timer += delta

              if wanted_level > 0 and police_spawn_timer >= police_spawn_interval:
                  police_spawn_timer = 0.0
                  spawn_police()

              if wanted_level > 0 and police_units.is_empty():
                  if wanted_decay_timer > 35.0:
                      reduce_wanted()
                      wanted_decay_timer = 0.0

              for officer in police_units.duplicate():
                  if not is_instance_valid(officer):
                      police_units.erase(officer)
                      continue

                  var distance = officer.global_position.distance_to(
                      player.global_position
                  )

                  if distance > 180:
                      police_units.erase(officer)
                      officer.queue_free()
                      continue

                  var direction = (
                      player.global_position - officer.global_position
                  )

                  direction.y = 0

                  if direction.length() > 1.8:
                      direction = direction.normalized()

                      officer.velocity.x = direction.x * 4.2
                      officer.velocity.z = direction.z * 4.2

                      officer.rotation.y = lerp_angle(
                          officer.rotation.y,
                          atan2(direction.x,direction.z),
                          delta*4.0
                      )
                  else:
                      officer.velocity.x = move_toward(
                          officer.velocity.x,0,12*delta
                      )
                      officer.velocity.z = move_toward(
                          officer.velocity.z,0,12*delta
                      )

                  if not officer.is_on_floor():
                      officer.velocity.y -= gravity*delta

                  officer.move_and_slide()

                  var attack_timer = officer.get_meta("attack_timer",0.0)
                  attack_timer += delta

                  if distance < 2.0 and attack_timer >= 1.2:
                      attack_timer = 0.0
                      take_player_damage(8.0)

                  officer.set_meta("attack_timer",attack_timer)

          var player_health = 100.0

          func take_player_damage(amount: float):
              player_health = max(0.0,player_health-amount)

              if player_health <= 0:
                  respawn_player()

          func respawn_player():
              player_health = 100.0
              wanted_level = 0

              for officer in police_units:
                  if is_instance_valid(officer):
                      officer.queue_free()

              police_units.clear()

              if vehicle_active:
                  vehicle_active = false
                  vehicle_speed = 0.0
                  player.visible = true

              player.global_position = Vector3(0,2,0)
              player.velocity = Vector3.ZERO

              print("PLAYER RESPAWNED")

          EOF

